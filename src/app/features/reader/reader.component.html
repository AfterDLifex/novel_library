<div class="reader" [style.--reader-theme]="theme()" [ngStyle]="readerStyle">
  @if (loading()) {
    <div class="loading"><app-loading-spinner /></div>
  } @else if (error()) {
    <div class="error">{{ error() }}</div>
  } @else if (currentChapter()) {
    <header class="reader-header" [class.hidden]="!showControls()">
      <button class="back-btn" (click)="router.navigate(['/novel', novelIdVal])">
        <app-icon name="back" size="20" />
      </button>
      <h2>{{ currentChapter()?.title }}</h2>
      <button class="settings-btn" (click)="toggleBottomSheet()">
        <app-icon name="settings" size="20" />
      </button>
    </header>

    <div class="content-wrapper">
      <div class="content" #contentEl (scroll)="onScroll()">
        <div class="chapter-content">
          @if (currentChapter()?.content) {
            <p [innerHTML]="currentChapter()?.content || 'Content not available.'" />
          } @else {
            <p class="no-content">Chapter content is not available. This source may not permit content display.</p>
          }
        </div>
      </div>
    </div>

    <footer class="reader-footer" [class.hidden]="!showControls()">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="progressPercent()" />
      </div>

      <div class="nav-bar">
        <button class="nav-btn" (click)="prevChapter()">
          <app-icon name="arrowBack" size="20" />
        </button>
        <span class="chapter-title">{{ currentChapter()?.title }}</span>
        <button class="nav-btn" (click)="nextChapter()">
          <app-icon name="arrowForward" size="20" />
        </button>
      </div>
    </footer>

    <div class="bottom-sheet" [class.open]="isBottomSheetOpen()">
      <div class="sheet-handle" (click)="toggleBottomSheet()" />
      <div class="sheet-content">
        <h3>Reader Settings</h3>
        <div class="setting-group">
          <label>Font Size</label>
          <div class="slider-group">
            <button (click)="changeFontSize(-2)">A<span class="small">A</span></button>
            <input type="range" min="12" max="32" [value]="fontSize()" (input)="readerSettings.updateFontSize($any($event.target).valueAsNumber)" />
            <button (click)="changeFontSize(2)"><span class="large">A</span>A</button>
          </div>
        </div>
        <div class="setting-group">
          <label>Theme</label>
          <div class="theme-options">
            <button (click)="readerSettings.setTheme('light')" [class.active]="theme() === 'light'">Light</button>
            <button (click)="readerSettings.setTheme('dark')" [class.active]="theme() === 'dark'">Dark</button>
            <button (click)="readerSettings.setTheme('sepia')" [class.active]="theme() === 'sepia'">Sepia</button>
          </div>
        </div>
        <div class="setting-group">
          <label>Line Height</label>
          <input type="range" min="1" max="3" step="0.1" [value]="readerSettings.lineHeight()" (input)="readerSettings.setLineHeight($any($event.target).valueAsNumber)" />
        </div>
      </div>
    </div>
  }
